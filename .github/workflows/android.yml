name: android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release keystore if missing
        run: |
          if [ ! -f keystore/release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/release.jks -alias routerctl \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass routerctl2026 -keypass routerctl2026 \
              -dname "CN=Router Control, OU=Personal, O=Personal, L=Cairo, C=EG"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/release.jks
            git commit -m "Add release signing keystore" || true
            git push || echo "keystore push skipped"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build debug APK
        if: success()
        run: gradle assembleDebug --no-daemon 2>&1 | tee -a build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(tail -c 15000 build.log | jq -Rs '{body: ("Build failed. Log tail:\n```\n" + . + "\n```")}')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/1/comments" \
            -d "$BODY"

      - name: Publish APKs release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Signed release APK plus debug APK, built from this commit.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
